  <style>

    /* =====================================================
       RESET
    ====================================================== */

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }


    /* =====================================================
       BODY
    ====================================================== */

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      color: white;

      background:
        linear-gradient(
          rgba(0,0,0,0.65),
          rgba(0,0,0,0.75)
        ),
        url("https://images.unsplash.com/photo-1579952363873-27f3bade9f55?auto=format&fit=crop&w=1920&q=80");

      background-size: cover;

      background-position: center;

      background-attachment: fixed;

      padding: 30px 20px;

      overflow-x: hidden;
    }


    /* =====================================================
       MAIN FEEDBACK BOX
    ====================================================== */

    .feedback-box {

      width: 100%;

      max-width: 500px;

      padding: 40px;

      border-radius: 25px;

      background:
        rgba(255,255,255,0.12);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border:
        1px solid rgba(255,255,255,0.25);

      box-shadow:
        0 25px 60px rgba(0,0,0,0.55);

      text-align: center;

      animation:
        appear 0.8s ease;
    }


    /* =====================================================
       ANIMATION
    ====================================================== */

    @keyframes appear {

      from {

        opacity: 0;

        transform:
          translateY(30px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       LOGO
    ====================================================== */

    .logo {

      font-size:
        clamp(32px, 5vw, 38px);

      font-weight:
        bold;

      color:
        #39ff88;

      letter-spacing:
        1px;

      margin-bottom:
        5px;
    }


    /* =====================================================
       TAGLINE
    ====================================================== */

    .tagline {

      color:
        #eeeeee;

      font-size:
        14px;

      margin-bottom:
        25px;

      line-height:
        1.5;
    }


    /* =====================================================
       HEADING
    ====================================================== */

    h2 {

      margin:
        0;

      font-size:
        clamp(23px, 4vw, 28px);

      color:
        white;

      line-height:
        1.3;
    }


    /* =====================================================
       SUBTITLE
    ====================================================== */

    .subtitle {

      margin-top:
        10px;

      color:
        #dddddd;

      font-size:
        14px;

      line-height:
        1.5;

      margin-bottom:
        5px;
    }


    /* =====================================================
       INPUTS
    ====================================================== */

    input,
    textarea {

      width:
        100%;

      padding:
        14px 15px;

      margin-top:
        12px;

      border-radius:
        10px;

      border:
        1px solid rgba(255,255,255,0.25);

      outline:
        none;

      background:
        rgba(255,255,255,0.12);

      color:
        white;

      font-size:
        16px;

      transition:
        0.3s;
    }


    input::placeholder,
    textarea::placeholder {

      color:
        #cccccc;
    }


    input:focus,
    textarea:focus {

      border-color:
        #39ff88;

      box-shadow:
        0 0 12px
        rgba(57,255,136,0.3);
    }


    /* =====================================================
       TEXTAREA
    ====================================================== */

    textarea {

      height:
        120px;

      resize:
        vertical;

      min-height:
        100px;

      max-height:
        250px;

      line-height:
        1.5;
    }


    /* =====================================================
       RATING TITLE
    ====================================================== */

    .rating-title {

      margin-top:
        25px;

      margin-bottom:
        5px;

      font-size:
        15px;

      color:
        #eeeeee;
    }


    /* =====================================================
       STARS
    ====================================================== */

    .stars {

      display:
        flex;

      justify-content:
        center;

      align-items:
        center;

      gap:
        8px;

      margin:
        10px 0 15px;
    }


    .stars span {

      font-size:
        clamp(30px, 7vw, 38px);

      color:
        rgba(255,255,255,0.3);

      cursor:
        pointer;

      transition:
        0.2s;

      user-select:
        none;

      -webkit-tap-highlight-color:
        transparent;

      touch-action:
        manipulation;
    }


    .stars span:hover {

      transform:
        scale(1.2);

      color:
        #ffd43b;
    }


    .stars span.active {

      color:
        #ffd43b;

      text-shadow:
        0 0 12px
        rgba(255,212,59,0.6);
    }


    /* =====================================================
       RATING TEXT
    ====================================================== */

    #ratingText {

      min-height:
        20px;

      margin-bottom:
        5px;

      font-size:
        13px;

      color:
        #39ff88;
    }


    /* =====================================================
       BUTTON
    ====================================================== */

    button {

      width:
        100%;

      padding:
        15px;

      margin-top:
        15px;

      border:
        none;

      border-radius:
        10px;

      background:
        #39ff88;

      color:
        #06200f;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;

      transition:
        0.3s;

      min-height:
        50px;

      touch-action:
        manipulation;
    }


    button:hover {

      background:
        #20e66d;

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 25px
        rgba(57,255,136,0.35);
    }


    /* =====================================================
       FOOTER
    ====================================================== */

    .footer {

      margin-top:
        22px;

      color:
        #bbbbbb;

      font-size:
        12px;

      line-height:
        1.5;
    }


    /* =====================================================
       TABLET
       601px - 900px
    ====================================================== */

      body {

        padding:
          25px 18px;
      }

          100vh;

          15px;

          flex-start;

          100%;

          500px;

          30px 22px;

          20px;

          10px 0 10px;
      }

        font-size:

        padding:
          0 5px;
      }


      input,

        font-size:
          16px;

        padding:
          14px;
      }


      textarea {

        height:

      }


      .rating-title {

        margin-top:

      }

    /* =====================================================
       SMALL MOBILE

    ====================================================== */

    @media (max-width: 400px) {

      body {

        padding:

  </style>

</head>


<body>


  <!-- =====================================================
       FEEDBACK BOX
  ====================================================== -->

  <div class="feedback-box">


    <!-- LOGO -->

    <div class="logo">
      GrowItPlay
    </div>


    <div class="tagline">
      Book Your Turf. Play Your Game.
    </div>


    <!-- HEADING -->

    <h2>
      ⭐ We'd Love Your Feedback
    </h2>


    <div class="subtitle">

      Your feedback helps us make GrowItPlay
      better for every player.

    </div>


    <!-- NAME -->

    <input
      type="text"
      id="name"
      placeholder="Your Name"
      autocomplete="name">


    <!-- EMAIL -->

    <input
      type="email"
      id="email"
      placeholder="Your Email"
      autocomplete="email">


    <!-- RATING -->

    <div class="rating-title">

      How was your GrowItPlay experience?

    </div>


    <div class="stars">

      <span onclick="rate(1)">★</span>

      <span onclick="rate(2)">★</span>

      <span onclick="rate(3)">★</span>

      <span onclick="rate(4)">★</span>

      <span onclick="rate(5)">★</span>

    </div>


    <div id="ratingText">
      Select a rating
    </div>


    <!-- FEEDBACK -->

    <textarea
      id="feedback"
      placeholder="Tell us about your experience..."></textarea>


    <!-- BUTTON -->

    <button onclick="submitFeedback()">
      Submit Feedback 🚀
    </button>


    <!-- FOOTER -->

    <div class="footer">

      © 2026 GrowItPlay | Turf Booking Platform

    </div>


  </div>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    let selectedRating = 0;


    /* =====================================================
       STAR RATING
    ====================================================== */

    function rate(number) {

      selectedRating = number;


      let stars =
        document.querySelectorAll(".stars span");


      stars.forEach((star, index) => {

        star.classList.toggle(
          "active",
          index < number
        );

      });


      let ratingText =
        document.getElementById("ratingText");


      let messages = {

        1: "😞 Poor Experience",

        2: "😕 Could Be Better",

        3: "🙂 Good Experience",

        4: "😄 Great Experience",

        5: "🤩 Excellent Experience!"

      };


      ratingText.innerText =
        messages[number];

    }


    /* =====================================================
       SUBMIT FEEDBACK
    ====================================================== */

    function submitFeedback() {

      let name =
        document.getElementById("name")
        .value
        .trim();


      let email =
        document.getElementById("email")
        .value
        .trim();


      let feedback =
        document.getElementById("feedback")
        .value
        .trim();


      /* CHECK EMPTY FIELDS */

      if (
        name === "" ||
        email === "" ||
        feedback === ""
      ) {

        alert(
          "Please fill in all the fields."
        );

        return;

      }


      /* CHECK RATING */

      if (selectedRating === 0) {

        alert(
          "Please select a rating."
        );

        return;

      }


      /* SUCCESS MESSAGE */

      alert(

        "Thank you, " +
        name +
        "! Your feedback has been submitted successfully. ⭐"

      );


      /* CLEAR FORM */

      document.getElementById("name")
        .value = "";


      document.getElementById("email")
        .value = "";


      document.getElementById("feedback")
        .value = "";


      /* RESET RATING */

      selectedRating = 0;


      document
        .querySelectorAll(".stars span")
        .forEach(function(star) {

          star.classList.remove("active");

        });


      document
        .getElementById("ratingText")
        .innerText =
        "Select a rating";

    }

  </script>


</body>

</html>
